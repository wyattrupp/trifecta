# Scope: all authored prose. Page chrome and generated tables are ignored.
StylesPath = ../styles
MinAlertLevel = error
IgnoredClasses = sphinxsidebar, related, footer, headerlink, needstable_wrapper

[*.html]
BasedOnStyles = TrifectaGenerated

[**/design/*.html]
BasedOnStyles = TrifectaGenerated
Trifecta.REQ_NO_DECISION_LANGUAGE = YES
