# A warning located outside the repository, which no mapping can make repository-relative.
expect: REQ_PORTABLE_FINDINGS
mutations:
- file: docs/conf.py
  find: "from trifecta.ext.ontology import *  # noqa: F403\n"
  replace: |
    from trifecta.ext.ontology import *  # noqa: F403


    def setup(app):
        from sphinx.util import logging

        def warn(app):
            logging.getLogger(__name__).warning("outside", location="/outside.md:1")

        app.connect("builder-inited", warn)
