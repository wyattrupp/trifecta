# A dropped step whose number occurs in the task's entry only inside a longer number.
expect: REQ_DROP_REASONS
only: true
# Marking a step of a resolved task changes the task and its plan's reviewed content.
allow: [REQ_FROZEN_TASKS, REQ_REVIEW_CURRENT]
mutations:
- file: docs/plans/0001-plans-and-reviews.md
  find: "- [x] **3.1** Write"
  replace: "- [-] **3.1** Write"
- file: docs/plans/0001-plans-and-reviews.md
  find: "### Task 3 (2026-11-08)\n\nAs designed.\n"
  replace: "### Task 3 (2026-11-08)\n\nStep 13.1 of another plan was dropped.\n"
