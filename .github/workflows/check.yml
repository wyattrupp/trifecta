name: check

on:
  pull_request:
  push:
    branches: [main]

# The job runs PR-controlled code; it needs only to read the repository, and the Actions
# API, so a pull request's run can find main's store (COMP_CI_CACHE).
permissions:
  contents: read
  actions: read

# A pull request's attributes could name LFS for a file; never fetch LFS content.
env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Setup runs in a virtual environment, so the recorder's .pth file has somewhere to
      # go (COMP_RECORDER); later steps find its python first on the path. Pip and setup
      # keep what they download where the cache below carries it to the next run.
      - name: Virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/downloads/pip" >> "$GITHUB_ENV"
          echo "TRIFECTA_DOWNLOADS=$RUNNER_TEMP/downloads/vale" >> "$GITHUB_ENV"
      # Downloads only, never bin/ or a result; setup checks the hash of everything it
      # restores (COMP_CI_CACHE).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: downloads
        with:
          path: ${{ runner.temp }}/downloads
          key: downloads-${{ runner.os }}-${{ hashFiles('requirements.lock', 'src/trifecta/requirements.lock', 'src/trifecta/setup.py') }}
      # The recorder's test traces the build's system calls (REQ_REUSE_SOUND).
      - name: strace
        run: |
          command -v strace || { sudo apt-get update -q && sudo apt-get install -y -q strace; }
      - run: make setup
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.downloads.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      # The Makefile runs the check with --fresh: it reuses nothing.
      - name: Check (with MADR immutability against the base)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # The tip of main before this push, so every commit in a multi-commit push is
          # covered. All zeros when the branch is new.
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            make check BASE="origin/$BASE_REF"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            make check BASE="$BEFORE"
          else
            # History is held only against a base; a push whose base is not in the clone
            # (a force push, or a new branch) is not checked partially (REQ_FROZEN_TASKS).
            echo "::error::push base $BEFORE is not in the clone; history cannot be checked"
            exit 1
          fi
      # The fixtures' store: empty in a push run on main, so every result in it is this
      # commit's; in a pull request run, the store of main's latest successful push run of
      # this workflow, found by run ID, and empty when there is none.
      - name: Store
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NAME: store-${{ runner.os }}
          STORE: ${{ runner.temp }}/store
        run: |
          rm -rf "$STORE" && mkdir "$STORE"
          [ "$EVENT" = "pull_request" ] || exit 0
          read -r id sha event branch repo path < <(gh api \
            "repos/$REPO/actions/workflows/check.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0] | "\(.id) \(.head_sha) \(.event) \(.head_branch) \(.head_repository.full_name) \(.path)"') || true
          if [ "$event $branch $repo $path" != "push main $REPO .github/workflows/check.yml" ]; then
            echo "::warning::no successful push run of main to take a store from (found: $id $event $branch $repo $path); the fixtures start from an empty store"
            exit 0
          fi
          # A tag named main also gives head_branch main: the run's commit must be one main
          # itself was at, on its first-parent chain, not any commit of a branch merged into it.
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || ! git rev-list --first-parent origin/main | grep -qx "$sha"; then
            echo "::warning::run $id ran $sha, no commit of main; the fixtures start from an empty store"
            exit 0
          fi
          if ! gh run download "$id" -R "$REPO" -n "$NAME" -D "$STORE"; then
            echo "::warning::run $id holds no $NAME; the fixtures start from an empty store"
            rm -rf "$STORE" && mkdir "$STORE"
          fi
      - run: make fixtures
        env:
          TRIFECTA_STORE: ${{ runner.temp }}/store
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: store-${{ runner.os }}
          path: ${{ runner.temp }}/store/
          if-no-files-found: error
      # The profiles (COMP_PROFILER): whatever the outcome, the tables go to the job summary
      # and the files to an artifact. Stage and fixture names and times only.
      - name: Profile
        if: always()
        run: |
          for f in docs/_build/profile/check.json docs/_build/profile/fixtures.json; do
            if [ -f "$f" ]; then python -m trifecta profile "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: profile-${{ runner.os }}
          path: docs/_build/profile/
          if-no-files-found: ignore

  # The same check on Windows (DEC_0025), run with the trifecta command and no make. bash, so a
  # failing command fails its step.
  check-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The hook's tests resolve 8.3 short names, which Windows makes only where they are on.
      - run: "fsutil.exe 8dot3name set C: 0"
      - name: Virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/Scripts" >> "$GITHUB_PATH"
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/downloads/pip" >> "$GITHUB_ENV"
          echo "TRIFECTA_DOWNLOADS=$RUNNER_TEMP/downloads/vale" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: downloads
        with:
          path: ${{ runner.temp }}/downloads
          key: downloads-${{ runner.os }}-${{ hashFiles('requirements.lock', 'src/trifecta/requirements.lock', 'src/trifecta/setup.py') }}
      - run: PYTHONPATH=src python -m trifecta setup
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.downloads.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/downloads
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Check (with MADR immutability against the base)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            trifecta check --fresh --base "origin/$BASE_REF"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            trifecta check --fresh --base "$BEFORE"
          else
            echo "::error::push base $BEFORE is not in the clone; history cannot be checked"
            exit 1
          fi
      - name: Store
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NAME: store-${{ runner.os }}
          STORE: ${{ runner.temp }}/store
        run: |
          rm -rf "$STORE" && mkdir "$STORE"
          [ "$EVENT" = "pull_request" ] || exit 0
          read -r id sha event branch repo path < <(gh api \
            "repos/$REPO/actions/workflows/check.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0] | "\(.id) \(.head_sha) \(.event) \(.head_branch) \(.head_repository.full_name) \(.path)"') || true
          if [ "$event $branch $repo $path" != "push main $REPO .github/workflows/check.yml" ]; then
            echo "::warning::no successful push run of main to take a store from (found: $id $event $branch $repo $path); the fixtures start from an empty store"
            exit 0
          fi
          # A tag named main also gives head_branch main: the run's commit must be one main
          # itself was at, on its first-parent chain, not any commit of a branch merged into it.
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || ! git rev-list --first-parent origin/main | grep -qx "$sha"; then
            echo "::warning::run $id ran $sha, no commit of main; the fixtures start from an empty store"
            exit 0
          fi
          if ! gh run download "$id" -R "$REPO" -n "$NAME" -D "$STORE"; then
            echo "::warning::run $id holds no $NAME; the fixtures start from an empty store"
            rm -rf "$STORE" && mkdir "$STORE"
          fi
      - run: trifecta fixtures
        env:
          TRIFECTA_STORE: ${{ runner.temp }}/store
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: store-${{ runner.os }}
          path: ${{ runner.temp }}/store/
          if-no-files-found: error
      - name: Profile
        if: always()
        run: |
          for f in docs/_build/profile/check.json docs/_build/profile/fixtures.json; do
            if [ -f "$f" ]; then python -m trifecta profile "$f" >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: profile-${{ runner.os }}
          path: docs/_build/profile/
          if-no-files-found: ignore
