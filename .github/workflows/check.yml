name: check

on:
  pull_request:
  push:
    branches: [main]

# The job runs PR-controlled code; it needs only to read the repository.
permissions:
  contents: read

# A pull request's attributes could name LFS for a file; never fetch LFS content.
env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: make setup
      - name: Check (with MADR immutability against the base)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # The tip of main before this push, so every commit in a multi-commit push is
          # covered. All zeros when the branch is new.
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            make check BASE="origin/$BASE_REF"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            make check BASE="$BEFORE"
          else
            # History is held only against a base; a push whose base is not in the clone
            # (a force push, or a new branch) is not checked partially (REQ_FROZEN_TASKS).
            echo "::error::push base $BEFORE is not in the clone; history cannot be checked"
            exit 1
          fi
      - run: make fixtures

  # The same check on Windows (DEC_0025), run with python commands and no make. bash, so a
  # failing command fails its step.
  check-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python tools/setup.py
      - name: Check (with MADR immutability against the base)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python tools/check.py --base "origin/$BASE_REF"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            python tools/check.py --base "$BEFORE"
          else
            echo "::error::push base $BEFORE is not in the clone; history cannot be checked"
            exit 1
          fi
      - run: python tools/run_fixtures.py
