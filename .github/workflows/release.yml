name: release

# A version tag builds the wheel, and a maintainer's approval of the `release` environment
# publishes it with its SHA-256 and a build provenance attestation (REQ_RELEASE_TRUST).
on:
  push:
    tags: ["v*"]

# Nothing by default; each job names what it needs.
permissions: {}

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The tag names the package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$TAG" = "v$version"
      # The build backend, pinned and hashed in the lock, and nothing fetched while building.
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip wheel --no-deps --no-build-isolation --no-index -w dist .
      - name: SHA-256
        working-directory: dist
        run: sha256sum trifecta-*.whl > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Waits for a maintainer's approval of the environment.
    environment: release
    # The only job that may write.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/trifecta-*.whl
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # --verify-tag: publish only for the tag that started this run, never create one.
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes "Install with the lock line in the README; verify with gh attestation verify."
