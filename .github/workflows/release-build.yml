name: release-build

# A version tag builds the wheel and its SHA-256, and attests the wheel's build provenance;
# besides that attestation it has read access only (wyatt, 2026-11-10: "Attest in the build
# job"). The tag's own copy of this file runs, so nothing here is trusted to publish:
# release-publish, which always runs from main, checks the tag names a commit on main and
# verifies this attestation before it publishes (REQ_RELEASE_TRUST).
on:
  push:
    tags: ["v*"]

permissions: {}

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The tag names the package's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$TAG" = "v$version"
      # Only the build backend, pinned and hashed in the lock; nothing is fetched to build.
      - name: Install the build backend
        run: |
          grep '^flit_core==' requirements.lock > "$RUNNER_TEMP/build.lock"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/build.lock"
      - run: python -m pip wheel --no-deps --no-build-isolation --no-index -w dist .
      - name: SHA-256
        working-directory: dist
        run: sha256sum trifecta-*.whl > SHA256SUMS
      # GitHub's own provenance: the tag, its commit and this workflow, signed for this job.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/trifecta-*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
