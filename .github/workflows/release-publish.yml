name: release-publish

# Runs from main's copy of this file whenever release-build finishes, so a tag cannot bring
# its own publishing steps. The guard job lets through only a build of a version tag that
# still names the built commit, a commit on main; the tag ruleset lets only an admin create,
# move or delete a tag, which the guard relies on. The publish job then waits for a
# maintainer to approve the release environment, verifies the build's attestation of the
# wheel, and is the only job that may write (REQ_RELEASE_TRUST).
on:
  workflow_run:
    workflows: ["release-build"]
    types: [completed]

permissions: {}

jobs:
  guard:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.path == '.github/workflows/release-build.yml'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: The build is of a version tag that names a commit on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a version tag: $TAG"; exit 1 ;; esac
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          test "$tagged" = "$SHA"
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...$main" --jq .status)
          case "$status" in ahead|identical) ;; *) echo "$SHA is not on main"; exit 1 ;; esac

  publish:
    needs: guard
    runs-on: ubuntu-24.04
    # Waits for a maintainer's approval of the environment.
    environment: release
    # The only job that may write.
    permissions:
      contents: write
      attestations: read
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # The build job attested the wheel; publish only a wheel whose attestation names
      # release-build at this tag and its commit.
      - name: The wheel's provenance names this tag's build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          for wheel in dist/trifecta-*.whl; do
            gh attestation verify "$wheel" --repo "$GITHUB_REPOSITORY" \
              --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-build.yml@refs/tags/$TAG" \
              --source-ref "refs/tags/$TAG" --source-digest "$SHA" --deny-self-hosted-runners
          done
          # The checksum file is from the same build; it must agree with the verified wheel.
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The tag must still name the commit that was built; --verify-tag never creates one.
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)" = "$SHA"
          wheel="trifecta-${TAG#v}-py3-none-any.whl"
          {
            echo "Built from \`$TAG\` (commit \`$SHA\`, on main). Verify the wheel's provenance:"
            echo
            echo '```sh'
            echo "gh attestation verify $wheel --repo $GITHUB_REPOSITORY --cert-identity https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-build.yml@refs/tags/$TAG --source-ref refs/tags/$TAG --source-digest $SHA --deny-self-hosted-runners"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/trifecta-*.whl dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
