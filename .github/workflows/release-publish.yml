name: release-publish

# Runs from main's copy of this file whenever release-build finishes, so a tag cannot bring
# its own publishing steps. The guard job lets through only a build of a version tag that
# still names the built commit, a commit on main; the tag ruleset lets only an admin create,
# move or delete a tag, which the guard relies on. The publish job then waits for a
# maintainer to approve the release environment, and is the only job that may write
# (REQ_RELEASE_TRUST).
on:
  workflow_run:
    workflows: ["release-build"]
    types: [completed]

permissions: {}

jobs:
  guard:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.path == '.github/workflows/release-build.yml'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: The build is of a version tag that names a commit on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a version tag: $TAG"; exit 1 ;; esac
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          test "$tagged" = "$SHA"
          main=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...$main" --jq .status)
          case "$status" in ahead|identical) ;; *) echo "$SHA is not on main"; exit 1 ;; esac

  publish:
    needs: guard
    runs-on: ubuntu-24.04
    # Waits for a maintainer's approval of the environment.
    environment: release
    # The only job that may write.
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # The build's provenance, from values the guard checked: the tag, its commit on main,
      # and the release-build run that built the wheel. Signed by this workflow on main.
      - name: Provenance
        env:
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_RUN: ${{ github.event.workflow_run.id }}
        run: |
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg tag "$TAG" --arg sha "$SHA" --arg run "$BUILD_RUN" '{
            buildDefinition: {
              buildType: "https://github.com/\($repo)/.github/workflows/release-build.yml",
              externalParameters: {workflow: {repository: "https://github.com/\($repo)",
                                              path: ".github/workflows/release-build.yml",
                                              ref: "refs/tags/\($tag)"}},
              resolvedDependencies: [{uri: "git+https://github.com/\($repo)@refs/tags/\($tag)",
                                      digest: {gitCommit: $sha}}]
            },
            runDetails: {
              builder: {id: "https://github.com/\($repo)/.github/workflows/release-build.yml@refs/tags/\($tag)"},
              metadata: {invocationId: "https://github.com/\($repo)/actions/runs/\($run)"}
            }
          }' > "$RUNNER_TEMP/provenance.json"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/trifecta-*.whl
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/provenance.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # The tag must still name the commit that was built; --verify-tag never creates one.
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)" = "$SHA"
          wheel="trifecta-${TAG#v}-py3-none-any.whl"
          {
            echo "Built from \`$TAG\` (commit \`$SHA\`). Verify the wheel's provenance:"
            echo
            echo '```sh'
            echo "gh attestation verify $wheel --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release-publish.yml --source-ref refs/heads/main --predicate-type https://slsa.dev/provenance/v1 --deny-self-hosted-runners"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/trifecta-*.whl dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
